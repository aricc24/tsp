#Experiment configuration for the TSP solver.

#This configuration is intended for the 150-city instance and was used to
#obtain a solution with a cost of approximately 0.138.

#The experiment performs a single run using one process. The initial
#temperature is automatically searched to reach the target acceptance rate.


DB=data/tsp.db
BASE_SEED=9433578794396893
TOTAL_RUNS=1
PROCESSES=1

INITIAL_TEMPERATURE=50000
SEARCH_TEMPERATURE=true
TARGET_ACCEPTANCE=0.85
EPSILON=0.00001
COOLING_FACTOR=0.995
BATCH_SIZE=4000
MAX_ATTEMPTS=75000
MAX_BATCHES_PER_TEMPERATURE=50
